<h3 class="text-2xl text-orange-700 text-center">User Details coming from json server</h3>

<ul>
    @for(user of users(); track user.id)
    {
       <div class="user-ul max-w-lg shadow-md m-4 p-4 rounded-lg">
            <ul class="space-y-2 text-gray-800">
                    <li class="flex justify-between">
                        <span>Id : </span>
                        <span>{{user.id}}</span> 
                    </li>
                    <li class="flex justify-between">
                        <span>Name : </span>
                        <span>{{user.name}}</span> 
                    </li>
                    <li class="flex justify-between">
                        <span>Age : </span>
                        <span>{{user.age}}</span> 
                    </li>
            </ul>
            <button class="bg-red-400 p-1 rounded-xs text-white m-1 cursor-pointer" (click)="deleteUser(user.id)">Delete User</button>
            <button class="bg-orange-400 p-1 rounded-xs text-white m-1 cursor-pointer" (click)="editUser(user.id)">Edit User</button>
        </div>
    }
</ul>
